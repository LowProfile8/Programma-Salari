name: keepalive-supabase
on:
  schedule:
    - cron: "17 6 */2 * *"
  workflow_dispatch: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Lettura di prova
        run: |
          curl -fsS "${{ secrets.SUPABASE_URL }}/rest/v1/archivio?id=eq.1&select=id" \
            -H "apikey: ${{ secrets.SUPABASE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_KEY }}"
